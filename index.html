<title>Bua Bank</title>

<style>
/* Layout: phone app. Header + scrolling content + 5-slot tab bar with raised scan button. Pages push on top with a back bar. Forms are bottom sheets. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f1f4f9; --fg:#14213d; --muted:#667189; --line:#e3e8f1;
  --brand:#1f6fff; --brand-ink:#ffffff; --brand-deep:#0a58e0; color-scheme:light; --in:#0a8a4a; --out:#d42a3a; --warn:#b45309;
  --font:'IBM Plex Sans Thai',-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding-block:14px 110px;gap:16px}
.center{align-items:center;text-align:center;padding-bottom:24px;justify-content:center}
.logo{width:84px;height:84px;border-radius:19px;display:block}
.logo.sm{width:38px;height:38px;border-radius:9px}
h1{font-size:24px;margin:0;font-weight:700}
h2{font-size:17px;margin:0;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.err{color:var(--out);min-height:20px;font-size:13px}
.btn{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:14px 18px;font-weight:600;width:100%;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--out);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;border-radius:10px;font-size:14px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=tel],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
input.amount{font-size:28px;font-weight:600;padding:14px}
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px 22px}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:26px;font-weight:500;text-align:center}
.pad .blank{visibility:hidden}
.top{display:flex;align-items:center;gap:10px}
.top .t{flex:1;min-width:0}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg)}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.backbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:4px;z-index:4}
.backbar .iconbtn{flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.acctcard{background:linear-gradient(145deg,var(--brand),var(--brand-deep));color:#fff;border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.acctcard .amt{font-size:22px;font-weight:600}
.pill{background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;font-weight:600;min-height:92px;justify-content:center}
.tile svg{width:26px;height:26px;color:var(--brand)}
.tile.row{flex-direction:row;text-align:left;justify-content:flex-start;padding:12px 14px;gap:12px;font-size:14px}
.tile.row svg{flex:none}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row>svg{width:20px;height:20px;flex:none}
.row .r{text-align:right;flex:none}
.grow{flex:1;min-width:0}
.ttl{font-weight:600}
.ico{width:38px;height:38px;border-radius:50%;background:var(--surface2);color:var(--brand);display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.in{color:var(--in)} .out{color:var(--out)}
.ico.in{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.ico.out{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.day{font-size:13px;font-weight:600;color:var(--muted);padding:6px 2px 0}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap;text-align:center}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sum div{background:var(--surface);padding:12px 14px}
.sum b{display:block;font-size:17px;font-weight:600}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:480px;align-items:end}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500;text-align:center}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--brand)}
.tabbar .scan{margin-top:-26px}
.tabbar .scan span{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;border:4px solid var(--surface)}
.tabbar .scan svg{width:28px;height:28px}
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface2);font-size:18px;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface2);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.ok{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
.ok .tick{width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--in) 18%,transparent);color:var(--in);display:grid;place-items:center}
.ok .tick.no{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.ok .tick svg{width:34px;height:34px}
.tag{font-size:9px;color:var(--muted);opacity:.75;letter-spacing:.02em}
.sw{position:relative;width:48px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--brand)} .sw.on::after{transform:translateX(20px)}
.cardvis{border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,#1d2f57,#0a1630);min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:grid;place-items:center;margin:0 auto}
.qrbox canvas,.qrbox img{max-width:100%;height:auto}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:12px 14px}
.stat{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}}}
</style>

/* ---------- data ops ---------- */
function freshData(){
  var a={id:uid()+"a",name:"บัญชีออมทรัพย์",number:ACC_NO,bal:INITIAL};
  return {accounts:[a],tx:[{id:uid(),ts:Date.now(),type:"deposit",amt:INITIAL,acc:a.id,cp:null,note:"เงินฝากเริ่มต้น",after:INITIAL}]}
}
function rec(type,amt,a,note){S.tx.unshift({id:uid(),ts:Date.now(),type:type,amt:amt,acc:a.id,cp:null,note:(note||"").trim(),after:a.bal})}
function doIn(amt,note){var a=A0();a.bal+=amt;rec("deposit",amt,a,note);save()}
function doOut(type,amt,note){var a=A0();a.bal-=amt;rec(type,amt,a,note);save()}
function noteHtml(n){var tag=" · ข้อมูลตัวอย่าง",has=n.indexOf(tag)>-1,base=has?n.replace(tag,""):n;return esc(base)+(has?' <span class="tag" title="ข้อมูลตัวอย่าง">ex</span>':"")}

/* ---------- sample data for development (current month only) ---------- */
function seedSample(){
  var d=freshData(),A=d.accounts,a=A[0],tx=[],now=Date.now(),TAG=" · ข้อมูลตัวอย่าง",Y=new Date().getFullYear(),M=new Date().getMonth();
  function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
  function rnd(lo,hi){return Math.round((lo+Math.random()*(hi-lo))*100)}
  function add(type,amt,when,note){when=Math.min(when,now-1000);a.bal+=type==="deposit"?amt:-amt;tx.push({id:uid(),ts:when,type:type,amt:amt,acc:a.id,cp:null,note:note+TAG,after:a.bal})}
  a.bal=0;
  add("deposit",INITIAL,new Date(Y,M,1,9,12).getTime(),"เงินฝากเริ่มต้น");
  var days=Math.max(2,new Date(now).getDate()-1),n=days>=12?5:days>=6?4:2;
  var spend=[["ชำระเงิน ร้านอาหาร",180,650],["ชำระเงิน ร้านสะดวกซื้อ",90,420],["ค่าโทรศัพท์",299,499],["ค่าไฟ",650,1250],["ชำระเงิน ร้านกาแฟ",70,160],["ค่าน้ำ",140,320],["ชำระเงิน ร้านค้า",250,1400]];
  var order=spend.slice().sort(function(){return Math.random()-0.5}).slice(0,n),ds=[];
  for(var i=0;i<n;i++)ds.push(2+Math.floor(Math.random()*Math.max(1,days-1)));
  ds.sort(function(x,y){return x-y});
  var items=ds.map(function(dd,k){return {d:dd,type:"withdraw",amt:rnd(order[k][1],order[k][2]),note:order[k][0]}});
  var exp=0;items.forEach(function(it){exp+=it.amt});
  var inc=TARGET-INITIAL+exp,incDay=Math.min(days,Math.max(5,Math.floor(days*0.5))),nm=(S&&S.name)||DEFAULT_NAME;
  if(inc>0)items.push({d:incDay,type:"deposit",amt:inc,note:"โอนเข้าจาก "+nm});
  items.sort(function(x,y){return x.d-y.d});
  items.forEach(function(it){add(it.type,it.amt,new Date(Y,M,it.d,8+Math.floor(Math.random()*13),Math.floor(Math.random()*60)).getTime(),it.note)});
  var diff=TARGET-a.bal;
  if(diff!==0){add(diff>0?"deposit":"withdraw",Math.abs(diff),now-60000,diff>0?"โอนเข้าจาก "+nm:"ชำระเงิน ร้านอาหาร")}
  tx.sort(function(x,y){return x.ts-y.ts});
  var b=0;tx.forEach(function(t){b+=t.type==="deposit"?t.amt:-t.amt;t.after=b});
  S.accounts=A;a.bal=b;S.tx=tx.reverse();S.seed=2;save()
}

/* ---------- PIN pad ---------- */
function padHtml(){
  var keys=["1","2","3","4","5","6","7","8","9","","0","⌫"],h='<div class="pinwrap"><div class="dots" aria-label="PIN">';
  for(var i=0;i<PIN_LEN;i++)h+='<i class="'+(i<pin.length?"on":"")+'"></i>';
  h+='</div><div class="pad">';
  keys.forEach(function(k){h+=k===""?'<button class="blank" tabindex="-1" aria-hidden="true"></button>':'<button type="button" data-k="'+k+'" aria-label="'+(k==="⌫"?"ลบ":k)+'">'+k+'</button>'});
  return h+"</div></div>"
}
function bindPad(onDone){
  document.querySelectorAll(".pad button[data-k]").forEach(function(b){
    b.onclick=function(){
      var k=b.dataset.k;
      if(k==="⌫"){pin=pin.slice(0,-1)}else if(pin.length<PIN_LEN){pin+=k}
      document.querySelectorAll(".dots i").forEach(function(d,i){d.className=i<pin.length?"on":""});
      if(pin.length===PIN_LEN){var v=pin;setTimeout(function(){onDone(v)},120)}
    }
  })
}

/* ---------- auth screens ---------- */
function renderSetup(){
  $app.innerHTML='<div class="screen center"><img class="logo" src="'+ICON+'" alt=""><h2>สวัสดี '+esc(setup.name)+'</h2>'+
    '<h3>'+(setup.step==="pin"?"ตั้ง PIN "+PIN_LEN+" หลัก":"ยืนยัน PIN อีกครั้ง")+'</h3><div class="err">'+esc(msg)+'</div>'+padHtml()+'</div>';
  bindPad(function(v){
    if(setup.step==="pin"){setup.first=v;setup.step="confirm";msg="";pin="";render()}
    else if(v===setup.first){
      var salt=uid();
      hash(v,salt).then(function(hh){
        var d=freshData();S={name:setup.name.trim(),salt:salt,pinHash:hh,accounts:d.accounts,tx:d.tx,fails:0,lock:0,ver:3,seen:Date.now()};
        seedSample();pin="";view="main";tab="home";nav=[];render()
      })
    }else{msg="PIN ไม่ตรงกัน กรุณาตั้งใหม่";pin="";setup.first="";setup.step="pin";render()}
  });
}
function renderLogin(){
  $app.innerHTML='<div class="screen center"><img class="logo" src="'+ICON+'" alt=""><h2>สวัสดี '+esc(S.name)+'</h2><div class="muted small">กรอก PIN เพื่อเข้าสู่ระบบ</div>'+
    '<div class="err">'+esc(msg)+'</div>'+padHtml()+'<button class="btn danger sm" id="forgot" style="margin-top:8px">ลืม PIN? ลบข้อมูลและเริ่มใหม่</button></div>';
  bindPad(function(v){
    if(S.lock&&S.lock>Date.now()){msg="ใส่ผิดหลายครั้ง กรุณารอ "+Math.ceil((S.lock-Date.now())/1000)+" วินาที";pin="";render();return}
    hash(v,S.salt).then(function(hh){
      pin="";
      if(hh===S.pinHash){S.fails=0;S.lock=0;save();msg="";view="main";tab="home";nav=[];render()}
      else{S.fails=(S.fails||0)+1;if(S.fails>=5){S.fails=0;S.lock=Date.now()+30000;msg="ใส่ผิดหลายครั้ง กรุณารอ 30 วินาที"}else msg="PIN ไม่ถูกต้อง เหลืออีก "+(5-S.fails)+" ครั้ง";save();render()}
    })
  });
  document.getElementById("forgot").onclick=function(){sheet={kind:"erase"};renderSheet()};
}

function periodRange(p){
  var n=new Date(),ms=new Date(n.getFullYear(),n.getMonth(),1).getTime(),end=Date.now()+1;
  if(p==="this")return{s:ms,e:end};
  if(p==="last")return{s:new Date(n.getFullYear(),n.getMonth()-1,1).getTime(),e:ms};
  if(p==="three")return{s:new Date(n.getFullYear(),n.getMonth()-2,1).getTime(),e:end};
  return{s:null,e:end}
}
function stmtData(){
  var r=periodRange(stmt.period),all=S.tx.slice().reverse();
  var ent=all.filter(function(t){return(r.s===null||t.ts>=r.s)&&t.ts<r.e});
  var open=0;if(r.s!==null){for(var i=all.length-1;i>=0;i--){if(all[i].ts<r.s){open=all[i].after;break}}}
  var tin=0,tout=0;ent.forEach(function(t){if((TYPES[t.type]||{}).in)tin+=t.amt;else tout+=t.amt});
  return{ent:ent,open:open,close:ent.length?ent[ent.length-1].after:open,tin:tin,tout:tout}
}

  var bar="";
  if(withTabs){
    var T=[["home","หน้าแรก","home"],["accounts","บัญชี","acct"],["scan","สแกน","scan"],["invest","การลงทุน","chart"],["more","บริการอื่นๆ","more"]];
    bar='<div class="tabbar"><nav>';
    T.forEach(function(t){
      if(t[0]==="scan")bar+='<button class="scan" data-go="scan" aria-label="สแกน"><span>'+ic("scan")+'</span><div style="font-size:11px;color:var(--muted)">สแกน</div></button>';
      else bar+='<button data-tab="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+ic(t[2])+t[1]+'</button>'
    });
    bar+='</nav></div>'
  }
  $app.innerHTML='<div class="screen">'+h+'</div>'+bar;
  bindMain(c)
}

function bindMain(c){
  function on(sel,fn){document.querySelectorAll(sel).forEach(function(el){el.onclick=function(e){fn(el,e)}})}
  on("[data-tab]",function(el){setTab(el.dataset.tab)});
  on("[data-go]",function(el){var p={};if(el.dataset.mode)p.mode=el.dataset.mode;if(el.dataset.id)p.id=el.dataset.id;go(el.dataset.go,p)});
  on("[data-s]",function(el){sheet={kind:el.dataset.s};renderSheet()});
  on("#bk",back);
  on("#eye",function(){S.hide=(S.hide===false);save();render()});
  on("#lockapp",function(){S.lockApp=!S.lockApp;save();render()});
  on("[data-f]",function(el){filter=el.dataset.f;render()});
  on("[data-p]",function(el){stmt.period=el.dataset.p;render()});
  on("[data-sw]",function(el){var k=el.dataset.sw;if(k==="showbal"){S.hide=(S.hide===false)}else{S[k]=!S[k]}save();render()});
  on("#lo",function(){view="login";pin="";msg="";nav=[];render()});
  on("#sd",function(){sheet={kind:"seed"};renderSheet()});
  on("#rs",function(){sheet={kind:"reset"};renderSheet()});
  on("#er",function(){sheet={kind:"erase"};renderSheet()});
  on("#copyst",function(){
    var m=document.getElementById("copymsg"),txt=stmtText();
    function fb(){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();m.textContent=ok?"คัดลอกแล้ว":"คัดลอกไม่สำเร็จ"}
    try{navigator.clipboard.writeText(txt).then(function(){m.textContent="คัดลอกแล้ว"},fb)}catch(e){fb()}
  });
  if(!c)return;
  var n=c.name;
  if(n==="xfer"||n==="topup"||n==="bill"||n==="cardless")bindForm(n,c.p);
  if(n==="profile")on("#pnsave",function(){var v=document.getElementById("pn").value.trim();if(!v)return;S.name=v;save();document.getElementById("pnmsg").textContent="บันทึกแล้ว"});
  if(n==="changepin")on("#pgo",function(){
    var a=document.getElementById("p0").value,b=document.getElementById("p1").value,d=document.getElementById("p2").value,e=document.getElementById("pe");
    if(!/^\d{6}$/.test(b)){e.textContent="PIN ใหม่ต้องเป็นตัวเลข 6 หลัก";return}
    if(b!==d){e.textContent="PIN ใหม่ไม่ตรงกัน";return}
    hash(a,S.salt).then(function(h){if(h!==S.pinHash){e.textContent="PIN ปัจจุบันไม่ถูกต้อง";return}
      hash(b,S.salt).then(function(h2){S.pinHash=h2;save();e.style.color="var(--in)";e.textContent="เปลี่ยน PIN แล้ว"})})
  });
  if(n==="pp"){
    on("#ppgo",function(){var v=document.getElementById("pm").value.replace(/\D/g,""),e=document.getElementById("pe");if(!/^0\d{9}$/.test(v)){e.textContent="กรุณากรอกเบอร์มือถือ 10 หลัก";return}S.pp=v.slice(0,3)+"-xxx-x"+v.slice(7);save();render()});
    on("#ppoff",function(){S.pp="";save();render()})
  }
  if(n==="myqr"){
    var box=document.getElementById("qrbox");
    try{new QRCode(box,{text:"Bua Bank | "+S.name+" | "+ACC_NO,width:200,height:200})}catch(e){box.innerHTML='<div class="small muted" style="padding:30px">สร้างคิวอาร์ไม่สำเร็จ</div>'}
  }
}

function bindForm(n,p){
  var go=document.getElementById("xgo"),am=document.getElementById("xa"),er=document.getElementById("xerr");
  function ok(){
    var v=parseAmt(am.value),m="",extra=true;
    if(n==="xfer"){var a2=document.getElementById("x2");extra=a2.value.trim().length>=4;if(p.mode!=="pp"){var x1=document.getElementById("x1");extra=extra&&x1.value.trim().length>0}}
    if(n==="topup"){extra=/^0\d{9}$/.test(document.getElementById("tp").value.replace(/\D/g,""))}
    if(n==="bill"){extra=document.getElementById("br").value.trim().length>=4}
    if(am.value.trim()&&v===null)m="กรุณากรอกจำนวนเงินที่ถูกต้อง";
    else if(v&&v>MAX)m="เกินวงเงินต่อรายการ";
    else if(v&&v>A0().bal)m="ยอดเงินในบัญชีไม่เพียงพอ";
    er.textContent=m;go.disabled=!(v&&!m&&extra)
  }
  document.querySelectorAll("input").forEach(function(i){i.oninput=ok});
  document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){am.value=b.dataset.q;document.querySelectorAll("[data-q]").forEach(function(x){x.classList.toggle("on",x===b)});ok()}});
  go.onclick=function(){
    var v=parseAmt(am.value);if(!v||v>A0().bal||v>MAX)return;
    if(n==="xfer"){sheet={kind:"blocked",amt:v};renderSheet();return}
    if(n==="topup"){var ph=document.getElementById("tp").value.replace(/\D/g,"");doOut("topup",v,"เติมเงินมือถือ "+ph.slice(0,3)+"-xxx-x"+ph.slice(7));sheet={kind:"done",title:"เติมเงินสำเร็จ",amt:v,sub:"เบอร์ "+ph.slice(0,3)+"-xxx-x"+ph.slice(7)}}
    if(n==="bill"){var cat=document.getElementById("bc").value,ref=document.getElementById("br").value.trim();doOut("bill",v,cat+" · "+ref);sheet={kind:"done",title:"ชำระบิลสำเร็จ",amt:v,sub:cat}}
    if(n==="cardless"){var code=String(Math.floor(100000+Math.random()*900000));doOut("withdraw",v,"ถอนเงินไม่ใช้บัตร");sheet={kind:"done",title:"สร้างรหัสถอนเงินแล้ว",amt:v,sub:"รหัส "+code+" · ใช้ได้ 15 นาที"}}
    render();renderSheet()
  }
}

/* ---------- sheets ---------- */
function closeSheet(){sheet=null;var s=document.getElementById("scrim");if(s)s.remove();if(view==="main")render()}
function renderSheet(){
  var old=document.getElementById("scrim");if(old)old.remove();
  if(!sheet)return;
  var k=sheet.kind,h="";
  if(k==="deposit"||k==="withdraw"){
    var title=k==="deposit"?"ฝากเงิน":"ถอนเงิน";
    h='<div class="hd"><h2>'+title+'</h2><button class="x" id="cls" aria-label="ปิด">✕</button></div>'+
      '<div class="small muted num">ยอดคงเหลือ '+money(A0().bal)+'</div>'+
      '<div class="field"><label for="am">จำนวนเงิน (บาท)</label><input id="am" class="amount num" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>'+
      '<div class="chips">'+[100,500,1000,5000].map(function(v){return '<button class="chip" data-q="'+v+'">'+v.toLocaleString("en-US")+'</button>'}).join("")+'</div>'+
      '<div class="field"><label for="nt">บันทึกช่วยจำ (ไม่บังคับ)</label><input id="nt" type="text" maxlength="60"></div><div class="err" id="serr"></div>'+
      '<button class="btn" id="go" disabled>ยืนยัน'+title+'</button><div class="xs muted">เมื่อยืนยันแล้ว รายการจะบันทึกในประวัติและแก้ไขย้อนหลังไม่ได้</div>';
  }else if(k==="done"){
    h='<div class="ok"><div class="tick">'+ic("tick")+'</div><h2>'+esc(sheet.title)+'</h2><div class="num" style="font-size:26px;font-weight:700">'+baht(sheet.amt)+'</div><div class="small muted">'+esc(sheet.sub)+'</div></div><button class="btn" id="cls">เสร็จสิ้น</button>';
  }else if(k==="blocked"){
    h='<div class="ok"><div class="tick no">'+ic("info")+'</div><h2>ยังไม่สามารถโอนเงินออกได้</h2><div class="small muted">บัญชีนี้ยังไม่เปิดให้โอนเงินออกไปยังบัญชีอื่น ระบบไม่ได้ตัดเงินจากบัญชีของคุณ</div></div><button class="btn" id="cls">ตกลง</button>';
  }else{
    var tt=k==="reset"?"รีเซ็ตยอดและประวัติทั้งหมด?":k==="seed"?"สร้างข้อมูลตัวอย่าง?":"ลบข้อมูลและ PIN ทั้งหมด?";
    var dd=k==="seed"?"จะแทนที่ประวัติและยอดปัจจุบันด้วยรายการตัวอย่างประมาณ 15 รายการในเดือนนี้ เพื่อใช้ทดสอบหน้าประวัติและสเตตเมนต์ ทุกรายการมีตัวย่อ ex กำกับ":"การกระทำนี้ย้อนกลับไม่ได้";
    h='<div class="hd"><h2>'+tt+'</h2></div><div class="small muted">'+dd+'</div><button class="btn'+(k==="seed"?"":" danger")+'" id="yes">'+(k==="reset"?"รีเซ็ต":k==="seed"?"สร้างข้อมูลตัวอย่าง":"ลบทั้งหมด")+'</button><button class="btn ghost" id="cls">ยกเลิก</button>';
  }
  var sc=document.createElement("div");sc.id="scrim";sc.className="scrim";sc.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+h+'</div>';
  document.body.appendChild(sc);
  sc.addEventListener("click",function(e){if(e.target===sc)closeSheet()});
  var c=document.getElementById("cls");if(c)c.onclick=function(){if(k==="done"&&nav.length){nav=[]}closeSheet()};
  var yes=document.getElementById("yes");
  if(yes)yes.onclick=function(){
    if(k==="seed"){seedSample();closeSheet();return}
    if(k==="reset"){seedSample();closeSheet();return}
    try{localStorage.removeItem(KEY)}catch(e){}S=null;mem=null;sheet=null;sc.remove();setup={step:"pin",name:DEFAULT_NAME,first:""};pin="";msg="";nav=[];view="setup";render()
  };
  if(k==="deposit"||k==="withdraw"){
    var am=document.getElementById("am"),go=document.getElementById("go"),er=document.getElementById("serr");
    function check(){
      var v=parseAmt(am.value),m="";
      if(am.value.trim()&&v===null)m="กรุณากรอกจำนวนเงินที่ถูกต้อง";
      else if(v&&v>MAX)m="เกินวงเงินต่อรายการ";
      else if(v&&k==="withdraw"&&v>A0().bal)m="ยอดเงินในบัญชีไม่เพียงพอ";
      er.textContent=m;go.disabled=!(v&&!m)
    }
    am.oninput=check;
    document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){am.value=b.dataset.q;check()}});
    go.onclick=function(){
      var v=parseAmt(am.value),note=document.getElementById("nt").value;
      if(!v||v>MAX)return;
      if(k==="deposit"){doIn(v,note);sheet={kind:"done",title:"ฝากเงินสำเร็จ",amt:v,sub:A0().name}}
      else{if(v>A0().bal)return;doOut("withdraw",v,note);sheet={kind:"done",title:"ถอนเงินสำเร็จ",amt:v,sub:A0().name}}
      render();renderSheet()
    };
    setTimeout(function(){try{am.focus()}catch(e){}},50)
  }
}

function render(){
  if(view==="setup")renderSetup();else if(view==="login")renderLogin();else renderMain();
  if(sheet)renderSheet()
}
$app=document.getElementById("app");
S=load();
if(S&&S.accounts&&S.ver===3&&S.accounts.length===1&&S.seed!==2&&S.tx.every(function(t){return (t.note||"").indexOf("ข้อมูลตัวอย่าง")>-1||t.note==="เงินฝากเริ่มต้น"})){seedSample()}
if(S&&S.accounts&&(S.accounts.length>1||S.ver!==3)){var had=S.tx.some(function(t){return (t.note||"").indexOf("ข้อมูลตัวอย่าง")>-1}),fd=freshData();S.accounts=fd.accounts;S.tx=fd.tx;S.ver=3;if(had)seedSample();save()}
if(S&&S.seen===undefined){S.seen=Date.now();save()}
view=S?"login":"setup";
render();
})();
</script>
